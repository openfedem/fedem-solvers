name: Regression testing

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build solvers and execute tests

    runs-on: ubuntu-22.04

    steps:
      - name: Install googletest
        uses: Bacondish2023/setup-googletest@v1

      - name: Silence some advice and hint
        run: |
          git config --global advice.detachedHead false
          git config --global init.defaultBranch main

      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download the pFUnit-3 package
        uses: robinraju/release-downloader@v1
        with:
          repository: openfedem/fedem-foundation
          fileName: 'pFUnit3_Ubuntu-22.04.tar.gz'
          latest: true
          extract: true

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install required python packages
        run: pip install numpy pandas progress PyYAML

      - name: Configure main build
        run: >
          GTEST_ROOT=/usr/local PFUNIT=${{ github.workspace }}/pFUnit3
          cmake -B ./build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SOLVER_AS_DLL=ON
          -DBUILD_CONTROL_AS_DLL=ON
          -DUSE_CONCURRENT_RECOVERY=ON
          -DUSE_SP_RECOVERY=ON
          -DUSE_FFTPACK=ON
          -DFT_LARGE_MODELS=OFF
          -DFT_TOLERANCE=1.0e-10

      - name: Build binaries and execute tests
        run: cmake --build ./build --target check
